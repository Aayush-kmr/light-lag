# Data provenance - every external input to LIGHT-LAG, what it is used for,
# where it comes from and under what terms. Rendered in-game by the
# "Data provenance" drawer and in docs/data-provenance.md.
#
# status:  used      - wired in and exercised by tests
#          fetch     - fetched by a tools/ script on the demo machine (not bundled)
#          planned   - integration designed, URL/filename still to confirm on site
sources:
  - id: naif_de440s
    name: "JPL planetary ephemeris DE440 (short version), de440s.bsp"
    provider: "NASA/JPL Solar System Dynamics, distributed by NAIF"
    url: "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp"
    use: "Earth, Mars, Sun positions; light time; SEP angle; porkchop"
    terms: "NASA/JPL public data"
    status: fetch
  - id: naif_lsk
    name: "Leapseconds kernel naif0012.tls"
    provider: "NAIF"
    url: "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls"
    use: "UTC <-> ephemeris time"
    terms: "NASA/JPL public data"
    status: fetch
  - id: naif_pck
    name: "Planetary constants kernel pck00011.tpc"
    provider: "NAIF"
    url: "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/pck00011.tpc"
    use: "Body radii; low-precision IAU_EARTH rotation"
    terms: "NASA/JPL public data"
    status: fetch
  - id: naif_stations
    name: "DSN station SPK earthstns_itrf93_201023.bsp + topocentric frames earth_topo_201023.tf"
    provider: "NAIF (data from DSN No. 810-005, 301, Rev. M)"
    url: "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/stations/ and .../fk/stations/"
    use: "Which DSN complex sees the ship; elevation; handover gaps"
    terms: "NASA/JPL public data"
    status: fetch
    note: "Filenames confirmed from NAIF kernel comments. NAIF also published earthstns_fx_260814.bsp (Aug 2026, EARTH_FIXED alias); either works."
  - id: naif_earth_bpc
    name: "High-precision Earth orientation PCK (earth_latest_high_prec.bpc or earth_000101_yymmdd_yymmdd.bpc)"
    provider: "NAIF"
    url: "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/"
    use: "ITRF93 frame for station pointing (falls back to IAU_EARTH, then to the IAU 2000 Earth Rotation Angle)"
    terms: "NASA/JPL public data"
    status: fetch
    note: "Exact current filename to confirm in the directory listing; the fetch script picks the newest match."
  - id: standish
    name: "Keplerian Elements for Approximate Positions of the Major Planets (E. M. Standish)"
    provider: "NASA/JPL SSD"
    url: "https://ssd.jpl.nasa.gov/planets/approx_pos.html"
    use: "Offline fallback ephemeris when no kernels are present (labelled ANALYTIC in the UI)"
    terms: "NASA/JPL public data"
    status: used
  - id: de421_dev
    name: "de421.bsp via the skyfield-data PyPI package"
    provider: "NASA/JPL, repackaged by the Skyfield project"
    url: "https://pypi.org/project/skyfield-data/"
    use: "Development and CI only: exercises the SPICE code path where NAIF is unreachable"
    terms: "JPL public data; package MIT"
    status: used
  - id: dsn_now
    name: "DSN Now live feed"
    provider: "NASA/JPL-Caltech"
    url: "https://eyes.nasa.gov/dsn/data/dsn.xml"
    use: "Ambient 'real world' panel at Lantern: which real spacecraft each real dish is talking to"
    terms: "NASA public website data; credit NASA/JPL-Caltech"
    status: fetch
  - id: donki
    name: "DONKI - Space Weather Database Of Notifications, Knowledge, Information (FLR, CME, SEP)"
    provider: "NASA CCMC via api.nasa.gov"
    url: "https://api.nasa.gov/DONKI/FLR?startDate=2017-09-01&endDate=2017-09-15&api_key=DEMO_KEY"
    use: "Replay real flares, CMEs and SEP events at in-game dates"
    terms: "NASA open API; api.nasa.gov key (DEMO_KEY rate-limited)"
    status: fetch
  - id: lit_sep_2017
    name: "SOL2017-09-10 X8.2 / GLE 72 event parameters"
    provider: "Peer-reviewed literature"
    url: "arXiv:1803.00461; arXiv:1803.07654; arXiv:1806.00226; arXiv:2004.00355"
    use: "Reference storm used when no DONKI cache exists (labelled as such)"
    terms: "Facts transcribed with citation"
    status: used
  - id: msl_rad
    name: "MSL RAD cruise dose: 1.84 mSv/day dose equivalent"
    provider: "Zeitlin et al., Science 340(6136):1080-1084 (2013)"
    url: "https://doi.org/10.1126/science.1235989"
    use: "Galactic cosmic ray baseline in the radiation model"
    terms: "Published measurement, cited"
    status: used
  - id: nasa_std_3001
    name: "NASA-STD-3001 Vol. 1 Rev. B - 600 mSv career effective dose limit"
    provider: "NASA"
    url: "https://www.nasa.gov/ (NASA Space Flight Human-System Standard)"
    use: "Debrief context (shown, not scored)"
    terms: "NASA standard, cited"
    status: used
  - id: nasa_conjunction_2021
    name: "2021 Mars solar conjunction command moratorium, Oct 2-16 2021"
    provider: "NASA/JPL news release 2021-200"
    url: "https://www.nasa.gov/solar-system/nasas-mars-fleet-lies-low-with-sun-between-earth-and-red-planet"
    use: "Validation: our SEP < 2 deg window starts 2021-10-02, the day NASA's moratorium began"
    terms: "NASA public information"
    status: used
  - id: jsc_transcripts
    name: "JSC History Portal Mission Transcript Collection (e.g. AS11_TEC.PDF, AS08_TEC.PDF)"
    provider: "NASA Johnson Space Center"
    url: "https://historycollection.jsc.nasa.gov/JSCHistoryPortal/history/mission_trans/mission_transcripts.htm"
    use: "Fine-tuning corpus: raw technical air-to-ground transcripts only"
    terms: "NASA works (17 U.S.C. 105). NASA's ALSJ notes 'no copyright is asserted' for the raw transcripts. The corrected Apollo Flight/Lunar Surface Journal texts ARE copyrighted and are excluded."
    status: fetch
  - id: blue_marble
    name: "Blue Marble (land surface, shaded relief, ocean) and Black Marble 2012 (VIIRS city lights), 4096 x 2048 equirectangular"
    provider: "NASA Earth Observatory / NASA Goddard; copies redistributed in the three-globe project (MIT)"
    url: "https://github.com/vasturiano/three-globe/tree/master/example/img (earth-blue-marble.jpg, earth-night.jpg, earth-water.png)"
    use: "Earth day map, night lights and ocean mask for sun glint (clients/shared/assets/earth_*.jpg)"
    terms: "NASA imagery, not copyrighted in the US; credit NASA Earth Observatory"
    status: used
  - id: mars_maps
    name: "Mars global colour map (Viking MDIM-based), 1440 x 720"
    provider: "NASA 3D Resources"
    url: "https://github.com/nasa/NASA-3D-Resources (Images and Textures / Mars)"
    use: "Mars surface texture (clients/shared/assets/mars.jpg); oriented with the IAU 2015 pole and rotation"
    terms: "NASA 3D Resources: free for use; credit NASA"
    status: used
  - id: bsc5
    name: "Yale Bright Star Catalogue, 5th revised edition (Hoffleit & Warren 1991): 9,096 stars, J2000 positions, V magnitude, B-V colour"
    provider: "Yale University Observatory via NASA HEASARC / CDS; JSON conversion by brettonw/YaleBrightStarCatalog"
    url: "http://tdc-www.harvard.edu/catalogs/bsc5.html ; https://github.com/brettonw/YaleBrightStarCatalog"
    use: "Every star in the 3D view, at its true J2000 direction, brightness and colour temperature (clients/shared/assets/stars_bsc5.json)"
    terms: "Public scientific catalogue; credit Hoffleit & Warren"
    status: used
  - id: fonts
    name: "Jost, IBM Plex Mono, Newsreader"
    provider: "indestructible type*, IBM, Production Type (via Fontsource)"
    url: "https://fontsource.org/"
    use: "Interface (Jost), numbers (Plex Mono), letters from home (Newsreader); vendored in clients/shared/fonts"
    terms: "SIL Open Font License 1.1 (licence files alongside the fonts)"
    status: used
  - id: threejs
    name: "three.js r187 (WebGLRenderer, OrbitControls, UnrealBloomPass)"
    provider: "three.js authors"
    url: "https://threejs.org/"
    use: "3D view of the ship, Earth, Mars, Sun and stars; vendored in clients/vendor/three"
    terms: "MIT"
    status: used
