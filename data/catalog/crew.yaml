# The crew of Meridian-1 and the two Earth seats.
#
# Seats: up to four humans play; any seat without a human is played by AI.
#   Earth: control (Flight Director), scientist (Mission Scientist)
#   Ship:  ship (Commander), engineer (Flight Engineer)
# The Science Officer and Flight Surgeon are always AI crew.
#
# Bios beyond Imani Reyes are DRAFTS for the team to edit.

seats:
  control:   { side: earth, title: "Flight Director",   station: "Lantern Control, Houston" }
  scientist: { side: earth, title: "Mission Scientist", station: "Lantern Science Support, Houston" }
  ship:      { side: ship,  title: "Commander",         station: "Meridian-1 flight deck", crew: reyes }
  engineer:  { side: ship,  title: "Flight Engineer",   station: "Meridian-1 systems bay", crew: okafor }

crew:
  - id: reyes
    name: "Imani Reyes"
    role: "Commander"
    seat: ship
    home: "Houston, Texas"
    want: "Bring all four of them home, and keep a promise to Lila."
    flaw: "Carries every decision alone until it is almost too late to share it."
    decision: "Whether to trust TERN when Houston cannot answer."
  - id: okafor
    name: "Daniel Okafor"
    role: "Flight Engineer"
    seat: engineer
    home: "Lagos, then Toulouse"
    want: "A ship with margin in every system."
    flaw: "Says 'I told you so' even when nobody needs to hear it."
    decision: "Argues against every kilogram cut from power and life support in design."
    draft: true
  - id: lindqvist
    name: "Dr. Sofia Lindqvist"
    role: "Science Officer"
    seat: null
    home: "Kiruna, Sweden"
    want: "Bring home the data that makes the second crew safer."
    flaw: "Will trade sleep, and sometimes margin, for one more observation."
    decision: "Which instrument runs when the battery cannot carry them all."
    draft: true
  - id: rao
    name: "Dr. Arjun Rao"
    role: "Flight Surgeon"
    seat: null
    home: "Pune, India"
    want: "Everyone's dose under the line, everyone sleeping."
    flaw: "Treats every warning as the worst case."
    decision: "When to order the crew into the storm shelter, and when to let them out."
    draft: true

# Per-crew-member daily consumption, from NASA's Life Support Baseline
# Values and Assumptions Document (BVAD). kg per crew member per day.
consumables_per_cm_day:
  food_as_shipped: { value: 1.80, sources: [ascend_2023_logistics], note: "BVAD Rev2 planning value at 30% food hydration" }
  wipes_gloves:    { value: 0.20, sources: [ascend_2023_logistics] }
  waste_hygiene:   { value: 0.30, sources: [ascend_2023_logistics] }
  ops_health_rec:  { value: 0.09, sources: [ascend_2023_logistics] }
  oxygen:          { value: 0.816, sources: [bvad_rev1, bvad_calc] }
  co2_produced:    { value: 1.04, sources: [bvad_rev1, bvad_calc] }
  potable_water:   { value: 2.50, sources: [bvad_rev1, bvad_calc, ochmo_eclss] }
  hygiene_water:   { value: 0.40, sources: [bvad_rev1, bvad_calc] }

water_recovery: { value: 0.98, sources: [iss_water_98], note: "ISS ECLSS with the Brine Processor Assembly (2023)" }
oxygen_closure: { value: 0.95, model: true, note: "MODEL: O2 regenerated by electrolysis of recovered water; 5% made up from stores" }
contingency_days: { value: 30, model: true, note: "MODEL: reserve beyond the planned mission length" }

habitat:
  dry_mass_t: { value: 30.0, model: true, note: "MODEL: pressurized transit habitat with systems and structure, crew of four" }
  net_habitable_m3: { value: 168.0, model: true, note: "MODEL: 42 m^3 per crew member" }
  shelter_area_m2: { value: 24.0, model: true, note: "MODEL: water wall around four sleep stations" }
